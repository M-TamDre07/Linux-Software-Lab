version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/paketscope
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
