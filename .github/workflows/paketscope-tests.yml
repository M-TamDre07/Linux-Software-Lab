name: PaketScope tests

on:
  push:
    paths:
      - "apps/paketscope/**"
      - ".github/workflows/paketscope-tests.yml"
  pull_request:
    paths:
      - "apps/paketscope/**"
      - ".github/workflows/paketscope-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/paketscope/pyproject.toml
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install project and test dependencies
        working-directory: apps/paketscope
        run: python -m pip install -e ".[test]"
      - name: Compile application modules
        working-directory: apps/paketscope
        run: python -m compileall -q paketscope
      - name: Run tests
        working-directory: apps/paketscope
        run: python -m pytest
