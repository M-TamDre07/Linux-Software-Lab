name: Website quality

on:
  push:
    branches: [main, "feature/linux-software-lab-global"]
    paths:
      - "public/**"
      - ".github/pull_request_template.md"
      - ".gitattributes"
      - ".editorconfig"
      - "templates/**"
      - ".gitignore"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "vercel.json"
      - ".github/workflows/deployment-integrity.yml"
      - ".github/workflows/site-quality.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
      - ".github/SECURITY.md"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - "public/**"
      - ".github/pull_request_template.md"
      - ".gitattributes"
      - ".editorconfig"
      - "templates/**"
      - ".gitignore"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "vercel.json"
      - ".github/workflows/deployment-integrity.yml"
      - ".github/workflows/site-quality.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
      - ".github/SECURITY.md"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Check the latest patched Node.js 24.x release even when an older version is cached.
          node-version: "24.x"
          check-latest: true
      - name: Show Node.js runtime version
        run: node --version
      - name: Synchronize generated Sorot distribution metadata
        run: python scripts/sync_distribution_index.py --write
      - name: Validate catalog metadata and release-state rules
        run: python scripts/validate_catalog.py
      - name: Validate the standard application scaffold manifest
        run: python scripts/validate_app_manifest.py
      - name: Check local links, canonical metadata, robots and sitemap
        run: python scripts/check_site_links.py
      - name: Check repository documentation links
        run: python scripts/check_docs_links.py
      - name: Check website JavaScript syntax
        run: |
          node --check public/assets/js/catalog-contract.js
          node --check public/assets/js/site.js
      - name: Test runtime catalogue contract
        run: node --test tests/test_catalog_contract.cjs
      - name: Validate website JSON and Vercel configuration
        run: |
          python -m json.tool public/data/software.json > /dev/null
          python -m json.tool public/data/software.schema.json > /dev/null
          python -m json.tool templates/application/application.schema.json > /dev/null
          python -m json.tool vercel.json > /dev/null
      - name: Run metadata, sitemap and link regression tests
        run: python -m unittest discover -s tests -v
