name: Website quality

on:
  push:
    branches: [main, "feature/linux-software-lab-global"]
    paths:
      - "public/**"
      - ".gitignore"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
  pull_request:
    paths:
      - "public/**"
      - ".gitignore"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog metadata and release-state rules
        run: python scripts/validate_catalog.py
      - name: Check local links, canonical metadata, robots and sitemap
        run: python scripts/check_site_links.py
      - name: Check website JavaScript syntax
        run: node --check public/assets/js/site.js
      - name: Validate website JSON and Vercel configuration
        run: |
          python -m json.tool public/data/software.json > /dev/null
          python -m json.tool public/data/software.schema.json > /dev/null
          python -m json.tool vercel.json > /dev/null
      - name: Run metadata, sitemap and link regression tests
        run: python -m unittest discover -s tests -v
