name: Website quality

on:
  push:
    branches: [main, "feature/linux-software-lab-global"]
    paths:
      - "public/**"
      - ".gitignore"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
      - ".github/SECURITY.md"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - "public/**"
      - ".gitignore"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "vercel.json"
      - ".github/workflows/site-quality.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
      - ".github/SECURITY.md"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Track the newest security-patched Node.js 24.x release, matching Vercel.
          node-version: "24.x"
      - name: Validate catalog metadata and release-state rules
        run: python scripts/validate_catalog.py
      - name: Check local links, canonical metadata, robots and sitemap
        run: python scripts/check_site_links.py
      - name: Check website JavaScript syntax
        run: node --check public/assets/js/site.js
      - name: Validate website JSON and Vercel configuration
        run: |
          python -m json.tool public/data/software.json > /dev/null
          python -m json.tool public/data/software.schema.json > /dev/null
          python -m json.tool vercel.json > /dev/null
      - name: Run metadata, sitemap and link regression tests
        run: python -m unittest discover -s tests -v
