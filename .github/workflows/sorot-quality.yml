name: Sorot source quality

on:
  push:
    branches: [main]
    paths:
      - "apps/sorot/**"
      - ".github/workflows/sorot-quality.yml"
  pull_request:
    paths:
      - "apps/sorot/**"
      - ".github/workflows/sorot-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sorot-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-source:
    name: Test patched source (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 fonts-dejavu-core
      - name: Verify immutable beta artifact checksums
        working-directory: apps/sorot/releases/0.5.0
        run: sha256sum -c SHA256SUMS
      - name: Validate all per-version Sorot release manifests
        run: python apps/sorot/validate_releases.py
      - name: Extract source archive for testing
        run: |
          mkdir -p "${RUNNER_TEMP}/sorot-source"
          unzip -q "$GITHUB_WORKSPACE/apps/sorot/releases/0.5.0/sorot-0.5.0.zip" -d "${RUNNER_TEMP}/sorot-source"
          echo "SOROT_SOURCE=${RUNNER_TEMP}/sorot-source/sorot-0.5.0" >> "$GITHUB_ENV"
      - name: Apply maintained source patches
        run: patch --batch --forward -p0 --input="$GITHUB_WORKSPACE/apps/sorot/patches/0001-validate-qt-plugin-elf.patch"
        working-directory: ${{ runner.temp }}/sorot-source/sorot-0.5.0
      - name: Apply bounded-output backend maintenance overlay
        run: python "$GITHUB_WORKSPACE/apps/sorot/patches/apply.py" "$SOROT_SOURCE"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: ${{ runner.temp }}/sorot-source/sorot-0.5.0
      - name: Run lint
        run: ruff check src tests
        working-directory: ${{ runner.temp }}/sorot-source/sorot-0.5.0
      - name: Run type checks
        run: mypy src
        working-directory: ${{ runner.temp }}/sorot-source/sorot-0.5.0
      - name: Run unit and offscreen GUI tests
        run: python -m pytest -q
        working-directory: ${{ runner.temp }}/sorot-source/sorot-0.5.0

  verify-package-build:
    name: Reproducible package build (without publishing)
    runs-on: ubuntu-latest
    needs: test-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian desktop-file-utils zip
      - name: Extract source and apply maintenance patches
        run: |
          mkdir -p "${RUNNER_TEMP}/sorot-source"
          unzip -q "$GITHUB_WORKSPACE/apps/sorot/releases/0.5.0/sorot-0.5.0.zip" -d "${RUNNER_TEMP}/sorot-source"
          cd "${RUNNER_TEMP}/sorot-source/sorot-0.5.0"
          patch --batch --forward -p0 --input="$GITHUB_WORKSPACE/apps/sorot/patches/0001-validate-qt-plugin-elf.patch"
          python "$GITHUB_WORKSPACE/apps/sorot/patches/apply.py" "${RUNNER_TEMP}/sorot-source/sorot-0.5.0"
          echo "SOROT_SOURCE=${RUNNER_TEMP}/sorot-source/sorot-0.5.0" >> "$GITHUB_ENV"
      - name: Build package and source archives in a temporary directory
        run: '"$SOROT_SOURCE/scripts/build-deb.sh" "$RUNNER_TEMP/sorot-dist-first"'
      - name: Validate package metadata and desktop entry
        run: |
          lintian --fail-on error,warning "$RUNNER_TEMP"/sorot-dist-first/*.deb
          desktop-file-validate "$SOROT_SOURCE/packaging/sorot.desktop"
      - name: Prove two consecutive builds are reproducible
        shell: bash
        run: |
          cp "$RUNNER_TEMP/sorot-dist-first/SHA256SUMS" "$RUNNER_TEMP/sorot-first.sha256"
          "$SOROT_SOURCE/scripts/build-deb.sh" "$RUNNER_TEMP/sorot-dist-second" >/dev/null
          diff <(awk '{print $1, $2}' "$RUNNER_TEMP/sorot-first.sha256") <(awk '{print $1, $2}' "$RUNNER_TEMP/sorot-dist-second/SHA256SUMS")
