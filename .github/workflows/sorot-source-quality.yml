name: Sorot source quality

on:
  push:
    branches: [main]
    paths:
      - "apps/sorot/**"
      - ".github/workflows/sorot-source-quality.yml"
  pull_request:
    paths:
      - "apps/sorot/**"
      - ".github/workflows/sorot-source-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sorot-source-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for Qt offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 fonts-dejavu-core
      - name: Verify immutable release artifacts
        run: cd apps/sorot && sha256sum -c SHA256SUMS
      - name: Safely extract verified source archive
        env:
          SOURCE_ROOT: ${{ runner.temp }}/sorot-source
        run: |
          python - <<'PY'
          import os
          import stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path("apps/sorot/sorot-0.5.0.zip")
          root = Path(os.environ["SOURCE_ROOT"]).resolve()
          seen = set()
          with ZipFile(archive) as source:
              bad = source.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              for info in source.infolist():
                  rel = PurePosixPath(info.filename)
                  if rel.is_absolute() or ".." in rel.parts or "\\" in info.filename:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  if info.filename in seen:
                      raise SystemExit(f"Duplicate ZIP path: {info.filename}")
                  seen.add(info.filename)
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink entries are not permitted: {info.filename}")
                  target = (root / Path(*rel.parts)).resolve()
                  target.relative_to(root)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with source.open(info) as inp, target.open("wb") as out:
                          out.write(inp.read())
          PY
      - name: Apply existing platform validation patch
        run: patch --batch -p0 -d "${{ runner.temp }}/sorot-source/sorot-0.5.0" < apps/sorot/patches/0001-validate-qt-plugin-elf.patch
      - name: Apply reviewed backend maintenance overlay
        run: python apps/sorot/patches/apply.py "${{ runner.temp }}/sorot-source/sorot-0.5.0"
      - name: Install test and analysis dependencies
        working-directory: ${{ runner.temp }}/sorot-source/sorot-0.5.0
        run: python -m pip install -e ".[dev]"
      - name: Run lint, type checking, and regression suite
        working-directory: ${{ runner.temp }}/sorot-source/sorot-0.5.0
        run: |
          ruff check src tests
          mypy src
          python -m pytest -q

  package-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Debian package validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian desktop-file-utils zip
      - name: Verify baseline and apply maintenance changes
        env:
          SOURCE_ROOT: ${{ runner.temp }}/sorot-package-source
        run: |
          (cd apps/sorot && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import os
          import stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path("apps/sorot/sorot-0.5.0.zip")
          root = Path(os.environ["SOURCE_ROOT"]).resolve()
          seen = set()
          with ZipFile(archive) as source:
              bad = source.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              for info in source.infolist():
                  rel = PurePosixPath(info.filename)
                  if rel.is_absolute() or ".." in rel.parts or "\\" in info.filename:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  if info.filename in seen:
                      raise SystemExit(f"Duplicate ZIP path: {info.filename}")
                  seen.add(info.filename)
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink entries are not permitted: {info.filename}")
                  target = (root / Path(*rel.parts)).resolve()
                  target.relative_to(root)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with source.open(info) as inp, target.open("wb") as out:
                          out.write(inp.read())
          PY
          patch --batch -p0 -d "${SOURCE_ROOT}/sorot-0.5.0" < apps/sorot/patches/0001-validate-qt-plugin-elf.patch
          python apps/sorot/patches/apply.py "${SOURCE_ROOT}/sorot-0.5.0"
      - name: Build package into a temporary directory and validate
        env:
          SOURCE_ROOT: ${{ runner.temp }}/sorot-package-source
          BUILD_DIR: ${{ runner.temp }}/sorot-dist
        run: |
          "${SOURCE_ROOT}/sorot-0.5.0/scripts/build-deb.sh" "${BUILD_DIR}"
          lintian --fail-on error,warning "${BUILD_DIR}"/*.deb
          desktop-file-validate "${SOURCE_ROOT}/sorot-0.5.0/packaging/sorot.desktop"
          cp "${BUILD_DIR}/SHA256SUMS" "${RUNNER_TEMP}/first-sums"
          "${SOURCE_ROOT}/sorot-0.5.0/scripts/build-deb.sh" "${RUNNER_TEMP}/sorot-dist-second" >/dev/null
          diff <(awk '{print $1}' "${RUNNER_TEMP}/first-sums") <(awk '{print $1}' "${RUNNER_TEMP}/sorot-dist-second/SHA256SUMS")
