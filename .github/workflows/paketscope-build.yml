name: PaketScope build

on:
  push:
    branches: [main, feature/paketscope-v3-native]
    tags: ["paketscope-v*"]
    paths:
      - "apps/paketscope/**"
      - ".github/workflows/paketscope-build.yml"
  pull_request:
    paths:
      - "apps/paketscope/**"
      - ".github/workflows/paketscope-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/paketscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/paketscope/pyproject.toml
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile source
        run: python -m compileall -q paketscope
      - name: Run unit tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  debian-package:
    name: Build, install, and purge on Debian 13
    runs-on: ubuntu-latest
    steps:
      # Checkout happens on the runner, where git is guaranteed to be available.
      # The package is then built and tested inside an isolated Debian 13 container.
      - uses: actions/checkout@v4
      - name: Build and smoke-test the Debian package in a clean container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=always \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/apps/paketscope \
            debian:trixie bash -s <<'DEBIAN_CI'
          set -euo pipefail

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev python3 python3-pyside6.qtwidgets \
            python3-cryptography desktop-file-utils

          chmod +x debian/rules
          dpkg-buildpackage --build=binary --no-sign

          package="$(find .. -maxdepth 1 -type f -name 'paketscope_*_all.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb -f "$package" Package)" = "paketscope"
          test "$(dpkg-deb -f "$package" Version)" = "3.0.0~dev2"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$package"
          dpkg-query -W -f='${Status}\n' paketscope | grep -Fx 'install ok installed'
          command -v paketscope
          desktop-file-validate /usr/share/applications/paketscope.desktop

          # Run outside the checkout and verify Python imports the installed package,
          # not the repository source tree (which could create a false-positive smoke test).
          cd /tmp
          env -u PYTHONPATH /usr/bin/python3 - <<'PYTHON_SMOKE'
          from pathlib import Path
          import paketscope

          module_path = Path(paketscope.__file__).resolve()
          installed_root = Path("/usr/lib/python3/dist-packages").resolve()
          assert module_path.is_relative_to(installed_root), (
              f"Imported source-tree package instead of installed Debian package: {module_path}"
          )
          assert paketscope.__version__ == "3.0.0.dev2", paketscope.__version__
          print(f"Installed package import OK: {module_path} (v{paketscope.__version__})")
          PYTHON_SMOKE

          DEBIAN_FRONTEND=noninteractive apt-get purge -y paketscope
          status="$(dpkg-query -W -f='${db:Status-Abbrev}' paketscope 2>/dev/null || true)"
          if [[ "$status" == ii* ]]; then
            echo "paketscope is still installed after purge (status: $status)"
            exit 1
          fi
          for path in /usr/bin/paketscope /usr/share/applications/paketscope.desktop /usr/lib/python3/dist-packages/paketscope; do
            if [[ -e "$path" ]]; then
              echo "Package-owned path remains after purge: $path"
              exit 1
            fi
          done
          DEBIAN_CI
      - name: Upload Debian 13 development package
        uses: actions/upload-artifact@v4
        with:
          name: paketscope-debian13-development
          path: apps/paketscope_*.deb
          if-no-files-found: error
          retention-days: 7

  publish-prerelease:
    name: Publish tagged development release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'paketscope-v')
    needs: [test, debian-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested Debian package
        uses: actions/download-artifact@v4
        with:
          name: paketscope-debian13-development
          path: dist/
      - name: Verify tag, generate SHA-256, and write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          deb_version="$(dpkg-deb -f "$package" Version)"
          expected_tag="paketscope-v${deb_version//~/-}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag mismatch: expected $expected_tag for Debian package version $deb_version, got $RELEASE_TAG"
            exit 1
          fi
          sha256sum "$package" > dist/SHA256SUMS
          cat > dist/RELEASE_NOTES.md <<'EOF'
          **Experimental development preview — not a stable release.**

          Built and tested in a clean Debian 13 CI container. Review the source and checksum before use.

          - Intended initial target: Debian 13.
          - APT install/remove/purge actions require a transaction preview, explicit confirmation, and the system authentication prompt.
          - Flatpak inventory is visible, but Flatpak install/remove is not enabled in this development build.
          - This CI check does not replace testing on a real desktop or a security review.
          EOF
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(dpkg-deb -f dist/*.deb Version)"
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "PaketScope $version — Development preview" \
            --notes-file dist/RELEASE_NOTES.md
