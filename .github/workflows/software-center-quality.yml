name: Software Center quality

on:
  push:
    branches: [main]
    paths:
      - "apps/software-center/**"
      - ".github/workflows/software-center-quality.yml"
  pull_request:
    paths:
      - "apps/software-center/**"
      - ".github/workflows/software-center-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Software Center core, CLI, and GUI
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 fonts-dejavu-core
      - name: Install package and test dependencies
        run: python -m pip install -e "apps/software-center[gui,test]"
      - name: Check code style
        run: ruff check apps/software-center/lsl_center apps/software-center/tests
      - name: Compile the launcher core
        run: python -m compileall -q apps/software-center/lsl_center
      - name: Run core, CLI, and offscreen GUI tests
        run: python -m pytest apps/software-center/tests -q
      - name: Build a wheel without publishing
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/software-center-wheel apps/software-center
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("/tmp/software-center-wheel").glob("*.whl"))
          assert len(wheels) == 1, "Expected one built wheel"
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "lsl_center/gui.py",
              "lsl_center/cli.py",
              "lsl_center/catalog.py",
              "lsl_center/installer.py",
              "lsl_center/data/catalog.json",
              "lsl_center/data/distribution-index.json",
              "lsl_center/data/manifests/sorot/0.5.0/release.json",
              "lsl_center/data/assets/center-icon.svg",
          }
          missing = sorted(required - names)
          assert not missing, f"Wheel is missing required files: {missing}"
          assert any(name.endswith("entry_points.txt") for name in names), "Console entry points missing"
          print(f"Wheel package contents validated: {wheels[0].name}")
          PY
